<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Tracker</title>
</head>
<body>
    <h2>Click below to get your location:</h2>
    <button onclick="getLocation()">Get Location</button>
    <p id="locationResult"></p>

    <script>
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                document.getElementById("locationResult").innerText = "Geolocation not supported.";
            }
        }

        function showPosition(position) {
            document.getElementById("locationResult").innerText =
                "Latitude: " + position.coords.latitude +
                ", Longitude: " + position.coords.longitude;
        }

        function showError(error) {
            document.getElementById("locationResult").innerText = "Error getting location.";
        }
    </script>
</body>
</html>
